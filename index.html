<style>

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar .spacer{flex:1}

.tabs{display:flex;gap:5px;overflow:auto;padding:4px;background:#10151e;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}.tab{background:transparent;border:0;color:var(--muted);white-space:nowrap}.tab.active{background:#293344;color:white}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(145deg,#171e29,#111720);border:1px solid var(--line);border-radius:13px;padding:16px;min-width:0}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.card h2{font-size:15px;margin:0 0 13px}.muted{color:var(--muted)}.small{font-size:11px}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0e141d;border:1px solid var(--line);border-radius:10px;padding:13px}.stat strong{display:block;font-size:25px;letter-spacing:-1px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.feed{display:flex;flex-direction:column;gap:9px}.news{border:1px solid var(--line);background:#0e141d;border-radius:10px;padding:12px;display:grid;grid-template-columns:95px 1fr;gap:12px}.tag{font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;display:inline-block;padding:4px 7px;border-radius:5px;background:#293344;color:#cbd6e5;height:max-content}.tag.confirmed{background:#123b2b;color:#80e0ae}.tag.rumour{background:#493817;color:#ffd17a}.tag.talks{background:#18365a;color:#9dc8ff}.news strong{display:block;margin-bottom:3px}.news p{margin:0;color:var(--muted);font-size:12px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.team{border:1px solid var(--line);background:#0e141d;border-radius:10px;padding:12px;border-left:4px solid var(--team,#777)}.teamhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.teamhead strong{font-size:13px}.seat{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;background:#171f2b;border-radius:7px;margin-top:5px;font-size:12px}.seat em{font-style:normal;color:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:9px 7px;border-bottom:1px solid var(--line)}td{padding:9px 7px;border-bottom:1px solid #222c3a}tr:last-child td{border-bottom:0}
.pill{padding:3px 7px;border-radius:20px;background:#273447;color:#d5e2f5;font-size:10px;white-space:nowrap}.rating{font-weight:800}.actions{display:flex;gap:5px;flex-wrap:wrap}
label{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}input,select{width:100%;background:#0c121a;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:7px;font:inherit;min-width:0}input:focus,select:focus{outline:1px solid var(--blue);border-color:var(--blue)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid .wide{grid-column:span 2}.field{min-width:0}.inline{display:flex;gap:7px;align-items:center}.inline>*{flex:1}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0}.progress{height:6px;background:#293344;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--red)}
dialog{background:#151d29;color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(520px,calc(100% - 24px));padding:20px}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}

<header><div class="top"><div class="brand"><div class="mark">F1</div><div><div class="eyebrow">PADDOCK INTELLIGENCE</div><h1>TRANSFER GENERATOR</h1></div></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end"><div class="season" id="seasonLabel">2026 TRANSFER WINDOW · WEEK 1</div><button id="newSeasonBtn" class="primary" style="display:none" onclick="startNewSeason()">Start New Season</button></div></div></header>
<main>

<dialog id="driverDialog"><div class="modalhead"><h2 id="driverDialogTitle">Add Driver</h2><button onclick="closeDialog('driverDialog')">✕</button></div><form id="driverForm" class="formgrid">
<input type="hidden" id="driverId"><div class="field"><label>Driver name</label><input id="driverName" required placeholder="e.g. Alex Albon"></div><div class="field"><label>Rating (1–100)</label><input id="driverRating" type="number" min="1" max="100" value="85" required></div>

<div class="field"><label>Ambition (1–10)</label><input id="driverAmbition" type="number" min="1" max="10" value="7"></div><div class="field"><label>Salary expectation ($m)</label><input id="driverSalary" type="number" min="0" max="200" value="8"></div>
<div class="field"><label>Experience (1–100)</label><input id="driverExperience" type="number" min="1" max="100" required></div><div class="field"><label>Pace (1–100)</label><input id="driverPace" type="number" min="1" max="100" required></div><div class="field"><label>Awareness (1–100)</label><input id="driverAwareness" type="number" min="1" max="100" required></div><div class="field"><label>Racecraft (1–100)</label><input id="driverRacecraft" type="number" min="1" max="100" required></div><div class="field"><label>Focus (1–100)</label><input id="driverFocus" type="number" min="1" max="100" required></div><div class="field wide"><label>Notes / personality</label><input id="driverNotes" placeholder="Optional"></div><div class="wide actions"><button class="primary" type="submit">Save driver</button><button type="button" onclick="closeDialog('driverDialog')">Cancel</button></div></form></dialog>
<dialog id="teamDialog"><div class="modalhead"><h2 id="teamDialogTitle">Edit Team</h2><button type="button" onclick="closeDialog('teamDialog')">✕</button></div><div class="formgrid">

}

function importSpreadsheetDriverMarket(force=false){
 const revision='2026-11-08-focus72-v1';
 if(!force && state.driverSpreadsheetRevision===revision)return {updated:0,added:0};
 let updated=0,added=0;
 const aliases={'alexanderalbon':'alexalbon','alexalbon':'alexalbon','andreakimiantonelli':'kimiantonelli','kimiantonelli':'kimiantonelli','robertschwartzman':'robertshwartzman','robertshwartzman':'robertshwartzman','nicolashulkenberg':'nicohulkenberg','nicohulkenberg':'nicohulkenberg','gabrielbortoleto':'gabrielbortoleto','isackhadjar':'isackhadjar'};
 const key=s=>{const n=normalizeMarketName(s);return aliases[n]||n};
 const existing=new Map(state.drivers.map(d=>[key(d.name),d]));
 for(const rec of spreadsheetDrivers){
   let d=existing.get(key(rec.name));
   if(!d){
     const isIcon=rec.team==='Icons';
     const team=state.teams.some(t=>t.name===rec.team)?rec.team:'Free Agent';
     d={id:uid(),name:rec.name,team,status:team==='Free Agent'?'Free Agent':'Contracted',expiry:state.season+1,ambition:7,salary:5,notes:isIcon?'Icon driver':''};
     state.drivers.push(d);existing.set(key(rec.name),d);added++;
   }else updated++;
   for(const field of ['rating','experience','racecraft','awareness','pace','focus','nationality'])if(rec[field]!==undefined&&rec[field]!=='')d[field]=rec[field];
   if(rec.age!==null)d.age=rec.age;
   // Existing team assignments are intentionally preserved, including any user transfers.
   if(rec.team==='Icons' && !state.teams.some(t=>t.name===d.team) && d.team!=='Icons'){d.team='Icons';d.status='Icon';}
 }
 state.driverSpreadsheetRevision=revision;
 return {updated,added};
}

function saveScheduleRound(){
 const round=Number(document.getElementById("scheduleRound").value),circuit=document.getElementById("scheduleCircuit").value.trim();
 if(!Number.isInteger(round)||round<1||round>99){alert("Enter a round number between 1 and 99.");return}
 if(!circuit){alert("Enter a circuit.");return}
 const existing=state.schedule.find(x=>x.round===round);
 if(existing)Object.assign(existing,{circuit,gp:"",date:""});else state.schedule.push({round,circuit});
 state.schedule.sort((a,b)=>a.round-b.round);save();render("schedule");
}
function editScheduleRound(round){
 const r=state.schedule.find(x=>x.round===round);if(!r)return;
 document.getElementById("scheduleRound").value=r.round;
 document.getElementById("scheduleCircuit").value=r.circuit;
 document.getElementById("scheduleCircuit").focus();
}
function deleteScheduleRound(round){
 if(!confirm("Remove round "+round+" from the schedule? Previously recorded race results will be kept."))return;
 state.schedule=state.schedule.filter(x=>x.round!==round);save();render("schedule");
}
function openScheduledRace(round){setTab("results");const sel=document.getElementById("scheduledRace");if(sel){sel.value=String(round);applyScheduledRace()}}

function standingsView(){const races=(state.raceResults||[]).filter(r=>Number(r.season)===Number(state.season)).slice().sort((a,b)=>Number(a.round)-Number(b.round));const driverMap=new Map(),teamMap=new Map();for(const race of races){for(const e of race.entries||[]){if(e.pos==null||Number(e.pos)<=0)continue;const points=f1Points(Number(e.pos)),key=String(e.driverId||e.driver),d=driverMap.get(key)||{name:e.driver||state.drivers.find(x=>x.id===e.driverId)?.name||"Unknown",team:e.team||"Unknown",points:0,wins:0,seconds:0,thirds:0,finishes:0};d.points+=points;d.finishes++;if(e.pos===1)d.wins++;if(e.pos===2)d.seconds++;if(e.pos===3)d.thirds++;driverMap.set(key,d);const team=e.team||"Unknown",t=teamMap.get(team)||{name:team,points:0,wins:0,seconds:0,thirds:0};t.points+=points;if(e.pos===1)t.wins++;if(e.pos===2)t.seconds++;if(e.pos===3)t.thirds++;teamMap.set(team,t)}}const rank=(a,b)=>b.points-a.points||b.wins-a.wins||b.seconds-a.seconds||b.thirds-a.thirds||a.name.localeCompare(b.name);const drivers=[...driverMap.values()].sort(rank),teams=[...teamMap.values()].sort(rank);const currentDrivers=state.drivers.filter(d=>d.status==="Contracted");for(const d of currentDrivers)if(![...driverMap.values()].some(x=>x.name===d.name))drivers.push({name:d.name,team:d.team,points:0,wins:0,seconds:0,thirds:0,finishes:0});for(const t of state.teams)if(!teamMap.has(t.name))teams.push({name:t.name,points:0,wins:0,seconds:0,thirds:0});drivers.sort(rank);teams.sort(rank);const table=(items,driver)=>`<div style="overflow:auto"><table><thead><tr><th>Pos</th><th>${driver?"Driver":"Constructor"}</th>${driver?"<th>Team</th>":""}<th>Points</th><th>Wins</th><th>2nd</th><th>3rd</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td><b>${i+1}</b></td><td><b>${esc(driver?x.name:teamDisplayName(x.name))}</b></td>${driver?`<td>${esc(teamDisplayName(x.team))}</td>`:""}<td><b>${x.points}</b></td><td>${x.wins}</td><td>${x.seconds}</td><td>${x.thirds}</td></tr>`).join("")}</tbody></table></div>`;return `<div class="grid"><div class="card span-12"><div class="sectionhead"><h2>${state.season} Championship Standings</h2><span class="pill">${races.length} races recorded</span></div><p class="muted small">Standard Formula 1 Grand Prix points: 25–18–15–12–10–8–6–4–2–1 for positions 1–10. No fastest-lap bonus. Constructor points are the sum of both drivers' race points. Ties use wins, second places, then third places. Standings update automatically when race results are saved or simulated.</p></div><div class="card span-6"><h2>Drivers' Championship</h2>${table(drivers,true)}</div><div class="card span-6"><h2>Constructors' Championship</h2>${table(teams,false)}</div></div>`}
function resultsView(){let next=state.schedule.length?(state.schedule.slice().sort((a,b)=>a.round-b.round).find(r=>!state.raceResults.some(x=>Number(x.round)===r.round&&x.season===state.season))||state.schedule[0]).round:state.raceResults.length+1;let scheduled=state.schedule.find(r=>r.round===next);return `<div class="grid"><div class="card span-5"><h2>Enter Grand Prix Results</h2><p class="muted small">Record race positions and optionally qualifying results. Race results affect car-relative performance, teammate comparisons, points and form.</p>${scheduleResultSelector()}<div class="field"><label>Round Number</label><input id="raceRound" type="number" min="1" step="1" value="${next}"></div><div class="field" style="margin-top:10px"><label>Circuit</label><input id="raceName" value="${esc(scheduled?.circuit||"")}" placeholder="e.g. Albert Park" autocomplete="off"></div><div class="field" style="margin-top:12px"><label style="display:flex;align-items:center;gap:9px;cursor:pointer"><input type="checkbox" id="disableQualifying" onchange="toggleQualifyingResults()" style="width:auto;accent-color:var(--accent)"> Disable qualifying results</label></div><div class="field" style="margin-top:10px"><label>Results entry method</label><select id="entryMode" onchange="toggleResultMode()"><option value="grid">All drivers (enter positions)</option><option value="quick">Only classified finishers</option></select></div><div id="resultInputs" style="margin-top:12px;max-height:470px;overflow:auto">${resultInputs()}</div><button class="primary" style="margin-top:14px;width:100%" onclick="submitRace()">Save race results & assess drivers</button><p class="muted small" style="margin-top:9px">Race result can be a finishing position, DNF, or DSQ. Qualifying position 0 = no time. Disabling qualifying excludes qualifying from performance scores and teammate comparisons.</p></div><div class="card span-7"><div class="sectionhead"><h2>Driver Performance Ratings</h2><span class="pill">${state.rac function toggleQualifyingResults(){const disabled=document.getElementById("disableQualifying")?.checked||false;document.querySelectorAll("#resultInputs .qualifying-input").forEach(el=>{el.style.display=disabled?"none":"";const input=el.querySelector("input");if(input)input.disabled=disabled})}

function expectedPosition(team){const target=teamTarget(team),base=({Contender:3,Midfield:9,"Points Challenge":13,Backmarker:17})[target]||11;const peers=state.teams.filter(t=>teamTarget(t)===target).sort((a,b)=>Number(b.strength||0)-Number(a.strength||0)||a.name.localeCompare(b.name));const index=peers.findIndex(t=>t.id===team.id);return Math.min(Math.max(1,state.teams.length*2),base+Math.max(0,index)*2)}
function expectedDriverPosition(d){const t=teamByName(d.team);if(!t)return 20;const mate=state.drivers.find(x=>x.id!==d.id&&x.status==="Contracted"&&x.team===d.team);const stronger=mate&&Number(d.rating||0)<Number(mate.rating||0);return Math.min(state.teams.length*2,expectedPosition(t)+(stronger?1:0))}
function seatSecurity(d){const p=perf(d),t=teamByName(d.team);if(!t||d.status!=="Contracted")return null;const starts=Number(p.securityRaces||0),security=Number.isFinite(p.seatSecurity)?p.seatSecurity:75;const label=starts<3?"Provisional":security>=85?"Very Secure":security>=70?"Secure":security>=50?"Under Review":security>=30?"At Risk":"Replacement Likely";return {security,label,starts,pressure:100-security,consecutiveRisk:Number(p.consecutiveRisk||0)}}
function updateSeatSecurity(d,e){if(e.pos===null)return;const p=ensurePerf(d),t=teamByName(d.team);if(!t)return;const previous=Number.isFinite(p.seatSecurity)?p.seatSecurity:75;const races=Number(p.securityRaces||0);const recent=Array.isArray(p.securityRecent)?p.securityRecent:[];const raw=Number(e.rawScore||0);let change=raw>=6?8:raw>=2?4:raw<=-6?-8:raw<=-2?-4:1;
// A DNF may be mechanical: apply a limited penalty, rather than assuming driver fault.
if(e.pos===0)change=Math.max(change,-2);if(e.pos===-1)change=Math.min(change,-10);
const lastTwo=recent.slice(-2);if(lastTwo.length===2&&lastTwo.every(v=>v<=-4)&&change<=-4)change-=2;else if(lastTwo.length===2&&lastTwo.every(v=>v>=4)&&change>=4)change+=2;
// Rookies receive five-race grace; highly rated drivers and longer contracts are more resilient.
const rookie=races<5&&(Number(d.age||30)<=23||Number(d.experience||0)<=1);if(rookie&&change<0)change=Math.ceil(change*.5);
if(change<0&&Number(d.rating||0)>=90)change=Math.ceil(change*.75);
if(change<0&&Number(d.expiry||0)>Number(state.season)+1)change=Math.ceil(change*.8);
if(change<0&&teamTarget(t)==="Contender")change=Math.floor(change*1.2);
if(change<0&&teamTarget(t)==="Backmarker")change=Math.ceil(change*.8);
// Consistent teammate defeats add pressure, but never exceed a modest race adjustment.
if(e.teammateRace===-1&&change<0)change-=1;else if(e.teammateRace===1&&change>0)change+=1;

 let contracted=state.drivers.filter(d=>d.status==="Contracted");
 let candidates=[];
 for(let t of state.teams){let seats=2-state.drivers.filter(d=>d.status==="Contracted"&&d.team===t.name).length;if(seats>0)candidates.push({t,seats})}
 if(!free.length||!candidates.length){let d=choose(contracted);if(!d){pushNews("rumour","Quiet in the paddock","No obvious driver-market moves are available. Add free agents or open a team seat.");save();render("news");return}
 let t=choose(state.teams.filter(x=>x.name!==d.team));pushNews("rumour",`${t.name} monitoring ${d.name}`,`The team is understood to be evaluating its options. ${d.name} currently drives for ${d.team}.`)}
 else {let d=choose(free),t=choose(candidates).t;let fit=Math.round((d.rating+t.strength*2+d.ambition*2+t.ambition*2)/5);let type=Math.random()<.25?"talks":"rumour";let headline=type==="talks"?`${t.name} opens talks with ${d.name}`:`${d.name} linked with ${t.name}`;let body=`The ${t.name} seat could be an attractive opportunity. The driver's rating is ${d.rating}, and the team's current competitiveness is ${t.strength}/10. No agreement has been reached.`;pushNews(type,headline,body)}
 save();render("news")
}
function transfer(d,t,why){let old=d.team;d.team=t.name;d.status="Contracted";d.expiry=state.season+1+Math.floor(Math.random()*3);pushNews("confirmed",`${d.name} joins ${t.name}`,`${d.name} has agreed a contract through ${d.expiry}. ${old&&old!=="Free Agent"?`The move sees the driver leave ${old}. `:""}${why||"The team believes the signing strengthens its lineup."}`);state.history.push({driver:d.name,from:old,to:t.name,season:state.season,week:state.week})}
function advanceWeek(){state.week++;if(Math.random()<.75)generateRumourSilent();save();render("overview")}
function generateRumourSilent(){if(Math.random()<.65&&replacementRumour())return;let free=state.drivers.filter(d=>["Free Agent","Reserve","F2 Prospect"].includes(d.status)),teams=state.teams.filter(t=>state.drivers.filter(d=>d.status==="Contracted"&&d.team===t.name).length<2);if(!free.length||!teams.length)return;let d=choose(free),t=choose(teams);pushNews(Math.random()<.2?"talks":"rumour",`${t.name} linked with ${d.name}`,`Paddock sources suggest ${t.name} have added ${d.name} to their shortlist. The team has yet to make a formal offer.`)}
function saveSettings(){state.season=+document.getElementById("seasonInput").value;state.week=+document.getElementById("weekInput").value;save();render("settings")}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`f1-transfer-generator-${state.season}-week-${state.week}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.drivers||!x.news)throw Error();state=x;if(!state.teams.some(t=>t.name==="Ford Racing Team"))state.teams.push({...initialTeams.find(t=>t.name==="Ford Racing Team"),id:uid()});
ensureFordDrivers();ensureDriverAttributes();if(!state.raceResults)state.raceResults=[];if(!state.performance)state.performance={};state.drivers.forEach(d=>{if(!state.performance[d.id])state.performance[d.id]={points:0,expected:0,score:0,form:0,starts:0,finishes:0,best:0,trend:"No data",recent:[],qualWins:0,qualLosses:0,raceWins:0,raceLosses:0,podiums:0,overperformances:0,underperformances:0,qualStarts:0}});save();render("overview");alert("Database imported.")}catch(e){alert("That file does not look like a valid Transfer Generator backup.")}};r.readAsText(file)}
function resetAll(){if(confirm("Restore the original teams and drivers? Your current changes will be lost unless exported first.")){state=defaultState();syncVideoDriverPool();ensureDriverAttributes();save();render("overview")}}
document.getElementById("advanceBtn").onclick=advanceWeek;document.getElementById("rumourBtn").onclick=generateRumour;document.getElementById("exportBtn").onclick=exportData;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};document.getElementById("resetBtn").onclick=resetAll;
render();
</script>
<script>
// Live reload for the local development server. No remote connections.
(function(){
 if(location.protocol!=='http:' || location.hostname!=='127.0.0.1') return;
 let previous=null;
 async function check(){
  try {
   const r=await fetch('/__version',{cache:'no-store'});
   if(!r.ok)return;
   const v=(await r.json()).version;
   if(previous!==null && previous!==v) location.reload();
   previous=v;
  } catch(e){}
 }
 check();setInterval(check,2000);
})();
</script>
